name: Craft Apps Web Builds

on:
  push:
    branches: [main]
    paths-ignore:
      - "AGENTS.md"
      - "README.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the combined suite asset to (e.g. v0.1.0)"
        required: false
        default: ""
        type: string
      source_run_id:
        description: "Existing workflow run ID to pull wasm-suite artifact from without rebuilding"
        required: false
        default: ""
        type: string
  # Rebuild periodically because the app source repositories are separate.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: web-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-universal-bridge:
    name: Verify universal Rust bridge crate
    if: ${{ inputs.source_run_id == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out craft-web-builds
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache shared wasm build tools
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: wasm-build-tools

      - name: Run native unit tests and clippy on craft-universal-bridge
        run: |
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo check --workspace --target wasm32-unknown-unknown

      - name: Stage trunk, wasm-bindgen, and wasm-opt once for all matrix jobs
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/wasm-build-tools"
          mkdir -p "$STAGE/bin" "$STAGE/trunk-cache/wasm-bindgen-0.2.129" "$STAGE/trunk-cache/wasm-opt-version_123/bin"

          # 1. Stage trunk 0.21.14 (try release tarball with retries; fall back to crates.io cargo install)
          if curl --proto '=https' -fsSL --retry 6 --retry-all-errors --retry-delay 2 \
            "https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            -o "$RUNNER_TEMP/trunk.tar.gz" && \
            echo "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  $RUNNER_TEMP/trunk.tar.gz" | sha256sum -c -; then
            tar -xzf "$RUNNER_TEMP/trunk.tar.gz" -C "$STAGE/bin" trunk
          else
            cargo install trunk --version 0.21.14 --locked
            cp "$HOME/.cargo/bin/trunk" "$STAGE/bin/trunk"
          fi
          chmod 0755 "$STAGE/bin/trunk"

          # 2. Stage wasm-bindgen 0.2.129 (try release tarball; fall back to crates.io cargo install)
          if curl --proto '=https' -fsSL --retry 6 --retry-all-errors --retry-delay 2 \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz" \
            -o "$RUNNER_TEMP/wb.tar.gz"; then
            tar -xzf "$RUNNER_TEMP/wb.tar.gz" --strip-components=1 -C "$STAGE/trunk-cache/wasm-bindgen-0.2.129"
          else
            cargo install wasm-bindgen-cli --version 0.2.129 --locked
            cp "$HOME/.cargo/bin/wasm-bindgen" "$STAGE/trunk-cache/wasm-bindgen-0.2.129/wasm-bindgen"
            cp "$HOME/.cargo/bin/wasm-bindgen-test-runner" "$STAGE/trunk-cache/wasm-bindgen-0.2.129/wasm-bindgen-test-runner" || true
          fi
          cp "$STAGE/trunk-cache/wasm-bindgen-0.2.129/wasm-bindgen" "$STAGE/bin/wasm-bindgen"
          chmod 0755 "$STAGE/bin/wasm-bindgen" "$STAGE/trunk-cache/wasm-bindgen-0.2.129/wasm-bindgen"

          # 3. Stage wasm-opt version_123 (try release tarball; fall back to system binaryen package)
          mkdir -p "$STAGE/lib" "$STAGE/trunk-cache/wasm-opt-version_123/lib"
          if curl --proto '=https' -fsSL --retry 6 --retry-all-errors --retry-delay 2 \
            "https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz" \
            -o "$RUNNER_TEMP/binaryen.tar.gz"; then
            tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" --strip-components=1 -C "$STAGE/trunk-cache/wasm-opt-version_123"
            cp -a "$STAGE/trunk-cache/wasm-opt-version_123/lib/"* "$STAGE/lib/" 2>/dev/null || true
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends binaryen
            cp /usr/bin/wasm-opt "$STAGE/trunk-cache/wasm-opt-version_123/bin/wasm-opt"
            find /usr/lib -name "libbinaryen.so*" -exec cp -a {} "$STAGE/lib/" \; -exec cp -a {} "$STAGE/trunk-cache/wasm-opt-version_123/lib/" \;
          fi
          cp "$STAGE/trunk-cache/wasm-opt-version_123/bin/wasm-opt" "$STAGE/bin/wasm-opt"
          chmod 0755 "$STAGE/bin/wasm-opt" "$STAGE/trunk-cache/wasm-opt-version_123/bin/wasm-opt"

      - name: Upload pre-staged wasm build tools
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-build-tools
          path: ${{ runner.temp }}/wasm-build-tools/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.app.id }}
    needs: verify-universal-bridge
    if: ${{ inputs.source_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        app:
          - { id: photocraft,     repo: photocraft,     web_fonts: false, craft_fonts_ref: "b076417b5880bd4154bd22f00695b1d28c6bea83" }
          - { id: vectorcraft,    repo: vectorcraft,    web_fonts: true,  craft_fonts_ref: "b076417b5880bd4154bd22f00695b1d28c6bea83" }
          - { id: lightcraft,     repo: lightcraft,     web_fonts: true,  craft_fonts_ref: "b076417b5880bd4154bd22f00695b1d28c6bea83" }
          - { id: pdfcraft,       repo: pdfcraft,       web_fonts: false, craft_fonts_ref: "b076417b5880bd4154bd22f00695b1d28c6bea83" }
          - { id: effectcraft,    repo: effectcraft,    web_fonts: false, craft_fonts_ref: "bfcbf714e45a3ea8e98f88ab2b7971372a576414" }
          - { id: designcraft,    repo: designcraft,    web_fonts: true,  craft_fonts_ref: "b076417b5880bd4154bd22f00695b1d28c6bea83" }
          - { id: figcraft,       repo: figcraft,       web_fonts: true,  craft_fonts_ref: "37827adc41fd165f9a9234ac40f94dbad353aa69" }
          - { id: filmcraft,      repo: filmcraft,      web_fonts: false, craft_fonts_ref: "b076417b5880bd4154bd22f00695b1d28c6bea83" }
          - { id: texturecraft,   repo: texturecraft,   web_fonts: true,  craft_fonts_ref: "aced4137c022f1f587624d48e81ec77e1914a9cc" }
          - { id: materialcraft,  repo: materialcraft,  web_fonts: true,  craft_fonts_ref: "3d9ab3a132ed0eff457e424226a435a901da30d3" }
          - { id: wordcraft,      repo: wordcraft,      web_fonts: true,  craft_fonts_ref: "b076417b5880bd4154bd22f00695b1d28c6bea83" }
          - { id: soundcraft,     repo: soundcraft,     web_fonts: false, craft_fonts_ref: "bfcbf714e45a3ea8e98f88ab2b7971372a576414" }
          - { id: deckcraft,      repo: deckcraft,      web_fonts: false, craft_fonts_ref: "37827adc41fd165f9a9234ac40f94dbad353aa69" }
          - { id: cadcraft,       repo: cadcraft,      web_fonts: false, craft_fonts_ref: "b076417b5880bd4154bd22f00695b1d28c6bea83" }
          - { id: gridcraft,      repo: gridcraft,      web_fonts: false, craft_fonts_ref: "b076417b5880bd4154bd22f00695b1d28c6bea83" }
          - { id: craft-anything, repo: craft-anything, web_fonts: false, craft_fonts_ref: "b076417b5880bd4154bd22f00695b1d28c6bea83" }

    steps:
      - name: Check out craft-web-builds overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _overlay

      - name: Stage overlay into runner temp
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/craft-web-builds"
          mv _overlay "$RUNNER_TEMP/craft-web-builds"

      - name: Check out app source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/${{ matrix.app.repo }}
          ref: main
          fetch-depth: 1

      - name: Check out craft-i18n when craft-i18n.rev is present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f craft-i18n.rev ]]; then
            REV="$(tr -d '[:space:]' < craft-i18n.rev)"
            git clone --depth 1 https://github.com/storytold/craft-i18n.git "$GITHUB_WORKSPACE/craft-i18n"
            (cd "$GITHUB_WORKSPACE/craft-i18n" && git fetch --depth 1 origin "$REV" && git checkout "$REV")
            echo "CRAFT_I18N_DIR=$GITHUB_WORKSPACE/craft-i18n" >> "$GITHUB_ENV"
            echo "CRAFT_I18N_REQUIRED=1" >> "$GITHUB_ENV"
          fi

      - name: Check out craft-fonts when web_fonts is enabled
        if: matrix.app.web_fonts
        shell: bash
        env:
          FONTS_REF: ${{ matrix.app.craft_fonts_ref }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/storytold/craft-fonts.git "$GITHUB_WORKSPACE/craft-fonts"
          (cd "$GITHUB_WORKSPACE/craft-fonts" && git fetch --depth 1 origin "$FONTS_REF" && git checkout "$FONTS_REF")
          echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts" >> "$GITHUB_ENV"
          echo "CRAFT_FONTS_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Apply universal Rust bridge insert and patch series
        shell: bash
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/craft-web-builds/scripts/apply-universal-bridge.sh" "${{ matrix.app.id }}" "$GITHUB_WORKSPACE"

      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.app.id }}

      - name: Download pre-staged wasm build tools
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-build-tools
          path: ${{ runner.temp }}/wasm-build-tools

      - name: Install Trunk, wasm-bindgen, and wasm-opt from pre-staged cache
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/wasm-build-tools"
          chmod 0755 "$STAGE/bin/"*
          if [[ -d "$STAGE/lib" ]] && compgen -G "$STAGE/lib/*" > /dev/null; then
            sudo cp -a "$STAGE/lib/"* /usr/local/lib/
            sudo ldconfig
          fi
          sudo install -m 0755 "$STAGE/bin/trunk" /usr/local/bin/trunk
          sudo install -m 0755 "$STAGE/bin/wasm-bindgen" /usr/local/bin/wasm-bindgen
          sudo install -m 0755 "$STAGE/bin/wasm-opt" /usr/local/bin/wasm-opt.real
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'if /usr/local/bin/wasm-opt.real --help 2>&1 | grep -q -- "--enable-bulk-memory-opt"; then' \
            '  exec /usr/local/bin/wasm-opt.real "$@"' \
            'fi' \
            'ARGS=()' \
            'for arg in "$@"; do' \
            '  [[ "$arg" == "--enable-bulk-memory-opt" ]] && continue' \
            '  ARGS+=("$arg")' \
            'done' \
            'exec /usr/local/bin/wasm-opt.real "${ARGS[@]}"' | sudo tee /usr/local/bin/wasm-opt > /dev/null
          sudo chmod 0755 /usr/local/bin/wasm-opt
          mkdir -p "$HOME/.cache/trunk"
          cp -R "$STAGE/trunk-cache/." "$HOME/.cache/trunk/"
          sudo cp /usr/local/bin/wasm-opt "$HOME/.cache/trunk/wasm-opt-version_123/bin/wasm-opt"
          chmod -R u+rwx "$HOME/.cache/trunk"
          trunk --version
          wasm-bindgen --version
          wasm-opt --version

      - name: Export app build metadata
        env:
          APP_ID: ${{ matrix.app.id }}
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$(printf '%s' "$APP_ID" | tr '[:lower:]-' '[:upper:]_')"
          SOURCE_SHA="$(git rev-parse HEAD)"
          BUILD_DATE="$(date -u +%F)"
          echo "${PREFIX}_BUILD_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"
          echo "${PREFIX}_BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"

      - name: Build and package web app
        run: packaging/web/package.sh

      - name: Stage package, unpacked site, and build metadata
        env:
          APP_ID: ${{ matrix.app.id }}
          APP_REPO: storytold/${{ matrix.app.repo }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find dist/release -maxdepth 1 -type f -name '*-web-*.zip' -print -quit)"
          test -n "$ZIP"

          OUT="$RUNNER_TEMP/web-artifact/$APP_ID"
          mkdir -p "$OUT/site"
          cp "$ZIP" "$OUT/"
          unzip -q "$ZIP" -d "$OUT/site"

          # For two-stage boot loaders (such as photocraft), app/*.js imports ./snippets/...
          # relative to app/; copy snippets/ into app/snippets/ so subpath hosting works cleanly.
          for sdir in "$OUT/site"/*/; do
            if [[ -d "${sdir}app" && -d "${sdir}snippets" && ! -d "${sdir}app/snippets" ]]; then
              cp -R "${sdir}snippets" "${sdir}app/snippets"
              (cd "$OUT/site" && zip -qr9 "$OUT/$(basename "$ZIP")" "$(basename "$sdir")")
            fi
          done

          INDEX="$(find "$OUT/site" -type f -name index.html -print -quit)"
          test -n "$INDEX"

          SOURCE_SHA="$(git rev-parse HEAD)"
          jq -n \
            --arg app "$APP_ID" \
            --arg repo "$APP_REPO" \
            --arg source_sha "$SOURCE_SHA" \
            --arg package "$(basename "$ZIP")" \
            --arg workflow_sha "$GITHUB_SHA" \
            --arg bridge_version "universal/1" \
            '{
              app: $app,
              repo: $repo,
              source_sha: $source_sha,
              package: $package,
              workflow_sha: $workflow_sha,
              bridge_version: $bridge_version
            }' > "$OUT/$APP_ID.json"

      - name: Upload app package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-${{ matrix.app.id }}
          path: ${{ runner.temp }}/web-artifact/${{ matrix.app.id }}/
          if-no-files-found: error
          retention-days: 7

  combine:
    name: Combine app packages
    needs: build
    if: ${{ inputs.source_run_id == '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download all app artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: web-*
          path: dist/all
          merge-multiple: true

      - name: Create manifest
        run: |
          set -euo pipefail
          jq -s 'sort_by(.app)' dist/all/*.json > dist/all/manifest.json
          ls -lh dist/all/

      - name: Upload complete suite
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-suite-${{ github.sha }}
          path: dist/all/
          if-no-files-found: error
          retention-days: 14

      - name: Report artifact
        run: |
          echo "Suite artifact ID: ${{ steps.upload.outputs.artifact-id }}" >> "$GITHUB_STEP_SUMMARY"

  attach-release-asset:
    name: Attach combined suite asset to release ${{ inputs.release_tag }}
    needs: combine
    if: ${{ always() && inputs.release_tag != '' && (inputs.source_run_id != '' || needs.combine.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download combined suite artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wasm-suite-*
          path: dist/suite
          merge-multiple: true
          run-id: ${{ inputs.source_run_id != '' && inputs.source_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package main combined asset and upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          COMBINED_ZIP="wasm-suite-${RELEASE_TAG}.zip"
          (cd dist/suite && zip -qr0 "$RUNNER_TEMP/$COMBINED_ZIP" .)
          ls -lh "$RUNNER_TEMP/$COMBINED_ZIP"

          REL_ID="$(gh api "/repos/${REPO}/releases" --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | .id" | head -n 1)"
          if [[ -z "$REL_ID" ]]; then
            echo "error: release ${RELEASE_TAG} not found" >&2
            exit 1
          fi

          # Remove any existing asset with the same name so re-runs are idempotent
          EXISTING_ASSET_ID="$(gh api "/repos/${REPO}/releases/${REL_ID}/assets" --jq ".[] | select(.name == \"${COMBINED_ZIP}\") | .id" | head -n 1)"
          if [[ -n "$EXISTING_ASSET_ID" ]]; then
            gh api -X DELETE "/repos/${REPO}/releases/assets/${EXISTING_ASSET_ID}"
          fi

          curl --proto '=https' -fsSL --retry 3 \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/zip" \
            --data-binary @"$RUNNER_TEMP/$COMBINED_ZIP" \
            "https://uploads.github.com/repos/${REPO}/releases/${REL_ID}/assets?name=${COMBINED_ZIP}" \
            | jq '{id, name, size, state, browser_download_url}'

